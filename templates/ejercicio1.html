<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Notas</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

<div class="contenedor">

    <h1>Formulario de Notas</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/procesar_notas" method="POST">

        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" name="nota1"
               min="10" max="70" step="1" required
               value="{{ nota1 | default('', true) }}">


        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" name="nota2"
               min="10" max="70" step="1" required
               value="{{ nota2 | default('', true) }}">

        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" name="nota3"
               min="10" max="70" step="1" required
               value="{{ nota3 | default('', true) }}">

        <label for="asistencia">Asistencia (%):</label>
        <input type="number" id="asistencia" name="asistencia"
               min="0" max="100" step="1" required
               value="{{ asistencia | default('') }}">

        <button type="submit" class="boton-enviar">
            Enviar
        </button>

    </form>

    {% if promedio is defined %}
        <div class="resultado">
            <p>Promedio: {{ promedio }}</p>
            <p>Asistencia: {{ asistencia }}%</p>
            <p>Estado: {{ estado }}</p>
        </div>
    {% endif %}

    <a href="/" class="enlace-volver">Volver al menú</a>

</div>

</body>
</html>
